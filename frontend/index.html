<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Event Tickets</title>

    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>

<body>
    <header>
        <h1>Event Tickets</h1>
        <p>View upcoming events and reserve your tickets.</p>
    </header>

    <main>
        <section aria-labelledby="events-heading">
            <h2 id="events-heading">Available events</h2>

            <p id="events-message">Events will appear here.</p>

            <div id="events-list"></div>
        </section>

        <section aria-labelledby="booking-heading">
            <h2 id="booking-heading">Book tickets</h2>

            <form id="booking-form">
                <label for="event-id">Event</label>

                <select id="event-id" name="event_id" required>
                    <option value="">Select an event</option>
                </select>

                <label for="customer-name">Name</label>

                <input
                    id="customer-name"
                    name="customer_name"
                    type="text"
                    maxlength="120"
                    required
                >

                <label for="customer-email">Email</label>

                <input
                    id="customer-email"
                    name="customer_email"
                    type="email"
                    maxlength="255"
                    required
                >

                <label for="quantity">Number of tickets</label>

                <input
                    id="quantity"
                    name="quantity"
                    type="number"
                    min="1"
                    max="6"
                    value="1"
                    required
                >

                <button type="submit">Book tickets</button>
            </form>

            <div id="booking-result" role="status"></div>
        </section>
    </main>
</body>
</html>
